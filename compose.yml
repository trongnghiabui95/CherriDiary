services:
  postgres-db:
    image: postgres:16-alpine
    container_name: cherridiary_postgres
    restart: always
    environment:
      POSTGRES_DB: cherridiary_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: "123456"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d cherridiary_db"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
