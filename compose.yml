services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cherri_diary
      POSTGRES_USER: cherri
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cherri -d cherri_diary"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
