spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cherri_diary}
    username: ${DB_USER:cherri}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
server:
  error:
    include-message: never
app:
  jwt-secret: ${JWT_SECRET}
  jwt-ttl-seconds: 28800
  upload-dir: ${UPLOAD_DIR:./uploads}
  bootstrap:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}
